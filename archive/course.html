<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="GESP 动态课程页：从服务端 API 加载级别课程内容。">
<title>GESP 动态课程</title>
<link rel="stylesheet" href="gesp-style.css">
<link rel="stylesheet" href="site.css">
<style>
  .course-shell { max-width: var(--page-max, 1120px); margin: 0 auto; padding: 14px 18px 52px; }
  .course-hero, .course-panel {
    background: var(--card, #fff);
    border: 1px solid var(--hairline, rgba(43,45,66,.12));
    border-radius: 28px;
    padding: 24px;
    margin: 18px 0;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 18px 48px rgba(0,0,0,.06);
  }
  .course-hero h1 { font-size: clamp(30px, 6vw, 56px); line-height: 1; margin: 8px 0 10px; }
  .course-hero p, .lesson-card p, .course-empty { color: var(--ink2, #6c6f93); }
  .course-map { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
  .course-map a, .lesson-card, .practice-card {
    background: var(--bg, #f7f9ff);
    border: 1px solid var(--hairline, rgba(43,45,66,.12));
    border-radius: 18px;
    padding: 14px;
    color: var(--ink, #2b2d42);
    text-decoration: none;
  }
  .course-map a.is-done { border-color: rgba(52,199,89,.45); }
  .lesson-list { display: grid; gap: 14px; }
  .lesson-card h2 { margin: 0 0 6px; font-size: clamp(20px, 4vw, 28px); }
  .lesson-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .lesson-tags span {
    background: rgba(94,96,206,.1);
    color: var(--accent, #5e60ce);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 800;
  }
  .lesson-blocks { margin: 8px 0 8px 20px; color: var(--ink, #2b2d42); }
  .lesson-practice {
    background: var(--card, #fff);
    border: 1px solid var(--hairline, rgba(43,45,66,.12));
    border-radius: 14px;
    padding: 12px;
    margin-top: 10px;
  }
  .lesson-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .lesson-actions button, .lesson-actions a, .practice-card a {
    border: 0;
    border-radius: 999px;
    padding: 8px 14px;
    background: var(--accent, #5e60ce);
    color: #fff;
    font: inherit;
    font-weight: 800;
    text-decoration: none;
    cursor: pointer;
  }
  .lesson-actions .demo-toggle {
    background: transparent;
    color: var(--accent, #5e60ce);
    border: 1.5px solid rgba(94,96,206,.35);
  }
  .lesson-actions .demo-toggle:hover { background: rgba(94,96,206,.08); }
  .demo-box { margin-top: 12px; }
  .demo-box[hidden] { display: none; }
  .demo-box iframe {
    width: 100%;
    height: clamp(420px, 60vh, 640px);
    border: 1px solid var(--hairline, rgba(43,45,66,.12));
    border-radius: 16px;
    background: #fff;
  }
  .practice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
  .progress-track { height: 12px; margin: 12px 0; background: rgba(43,45,66,.12); border-radius: 999px; overflow: hidden; }
  .progress-track i { display: block; height: 100%; background: var(--accent, #5e60ce); width: 0; transition: width .25s ease; }
</style>
</head>
<body>
<div class="course-shell">
  <header class="site-topbar">
    <a href="index.html" class="brand-mark" aria-label="GESP 学习中心首页">
      <span class="brand-icon">C</span>
      <span>GESP 学习中心</span>
    </a>
    <nav class="site-nav" aria-label="主导航">
      <a href="index.html">学习中心</a>
      <a href="courses.html" class="active" aria-current="page">课程</a>
      <a href="review.html">复习站</a>
      <a href="parent.html">家长中心</a>
      <a href="syllabus.html">官方考纲</a>
      <a href="notes.html">知识笔记</a>
      <a href="papers.html">真题资料库</a>
    </nav>
  </header>

  <main id="courseRoot">
    <div class="course-panel course-empty">正在加载课程内容……</div>
  </main>
</div>
<script src="course.js"></script>
</body>
</html>
